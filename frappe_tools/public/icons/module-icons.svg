<!-- Dual-tone module icons for the Frappe Tools dock entries and sidebar headers. Each module keeps
     its own frappe-ui ink colour, so the tones follow the light and dark theme. -->
<svg id="frappe-tools-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<symbol viewBox="0 0 24 24" id="icon-scanner-document-duotone" stroke="none" style="overflow: visible">
		<rect x="5" y="2.5" width="14" height="19" rx="2" style="fill: var(--ink-blue-3)" />
		<rect x="8" y="6.5" width="8" height="1.5" rx="0.75" style="fill: var(--ink-blue-6)" />
		<rect x="8" y="9.5" width="5.5" height="1.5" rx="0.75" style="fill: var(--ink-blue-6)" />
		<rect x="8" y="16.5" width="7" height="1.5" rx="0.75" style="fill: var(--ink-blue-6)" />
		<rect x="2" y="12.6" width="20" height="1.8" rx="0.9" style="fill: var(--ink-blue-6)" />
	</symbol>
	<symbol viewBox="0 0 24 24" id="icon-toolbox-duotone" stroke="none" style="overflow: visible">
		<path d="M9 9V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V9" style="fill: none; stroke: var(--ink-violet-6); stroke-width: 1.6" />
		<rect x="3" y="9" width="18" height="11.5" rx="2" style="fill: var(--ink-violet-3)" />
		<rect x="3" y="12.8" width="18" height="1.6" style="fill: var(--ink-violet-6)" />
		<rect x="10.4" y="11.6" width="3.2" height="4" rx="0.6" style="fill: var(--ink-violet-6)" />
	</symbol>
</svg>
